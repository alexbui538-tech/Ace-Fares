<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pay a trip charge | Ace Fares Rentals</title>
<link rel="icon" href="images/logo.png">
<style>
:root{--ivory:#FBF8F1;--paper:#fff;--cream:#F3ECDD;--line:#E4DCCB;--ink:#15130F;--ink-2:#514A3D;--ink-3:#6F6757;--gold:#AF8135;--gold-bright:#DAA336;--ok:#2F6B3A}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{border-bottom:1px solid var(--line);background:rgba(251,248,241,.96)}
.top .in{max-width:760px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center}
.top img{height:44px;width:auto;border-radius:4px}
.top span{margin-left:auto;color:var(--ink-3);font-size:.9rem}
main{max-width:560px;margin:0 auto;padding:32px 20px 72px}
h1{font-family:Georgia,serif;font-weight:400;font-size:2.1rem;line-height:1.15;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.rows div.tot{font-weight:700;border-bottom:0;font-size:1.1rem}
.note{background:var(--ivory);border-radius:10px;padding:10px 12px;color:var(--ink-2);margin:0}
.btn{min-height:52px;border-radius:12px;border:0;padding:0 22px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--gold-bright);color:var(--ink);width:100%}
.btn:disabled{opacity:.55;cursor:default}
.notice{border-radius:12px;padding:12px 14px;margin:0}
.notice.err{background:#FBE3D9;color:#7A2A13}
.notice.ok{background:#E3F0E2;color:#1F4A27}
.fine{color:var(--ink-3);font-size:.88rem;margin:0}
</style>
</head>
<body>
<header class="top"><div class="in"><a href="/"><img src="images/logo@2x.png" alt="Ace Fares" width="102" height="44"></a><span>Secure payment by Stripe</span></div></header>
<main>
  <h1>Trip charge</h1>
  <p class="lede" id="lede">Loading...</p>
  <p class="notice err" id="err" role="alert" hidden></p>
  <div class="card" id="card" hidden>
    <div class="rows" id="rows"></div>
    <p class="note" id="note" hidden></p>
    <p class="notice ok" id="paid" hidden>Paid. Thank you! A receipt is on its way to your email.</p>
    <button class="btn" id="pay" type="button" hidden></button>
    <p class="fine" id="fine">You'll pay on Stripe's secure page. Ace Fares never sees your full card number. Questions? Text <a href="sms:+19729946413">(972) 994-6413</a>.</p>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search), P = { car: Q.get("car") || "", ref: Q.get("ref") || "", c: Q.get("c") || "", t: Q.get("t") || "" };
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nice = s => new Date(s + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function err(m){ $("#err").textContent = m; $("#err").hidden = !m; }
async function load(tries = 0){
  let r, d = {};
  try { r = await fetch("/api/pay?" + new URLSearchParams(P)); d = await r.json(); } catch { $("#lede").textContent = ""; return err("We couldn't load this payment. Check your connection and refresh."); }
  if (!r.ok) { $("#lede").textContent = ""; return err(d.message || "This payment link isn't valid."); }
  $("#lede").textContent = `${d.label} for your ${d.carName} trip, ${nice(d.from)} to ${nice(d.to)}.`;
  $("#rows").innerHTML = d.lines.map(l => `<div><span>${esc(l.label)}</span><span>${money(l.amount)}</span></div>`).join("") + `<div class="tot"><span>Total</span><span>${money(d.total)}</span></div>`;
  if (d.note) { $("#note").hidden = false; $("#note").textContent = d.note; }
  $("#card").hidden = false;
  const paid = d.status === "paid";
  $("#paid").hidden = !paid; $("#pay").hidden = paid; $("#fine").hidden = paid;
  $("#pay").textContent = `Pay ${money(d.total)}`;
  if (!paid && Q.get("paid") && tries < 6) setTimeout(() => load(tries + 1), 2000);   // just came back from Stripe: wait for it to confirm
}
$("#pay").addEventListener("click", async () => {
  const b = $("#pay"); b.disabled = true; b.textContent = "Opening secure payment..."; err("");
  let r, d = {};
  try { r = await fetch("/api/pay", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(P) }); d = await r.json(); } catch {}
  if (r && r.ok && d.url) { location.href = d.url; return; }
  b.disabled = false; load(); err((d && d.message) || "Payment didn't open. Please try again.");
});
load();
</script>
</body>
</html>
