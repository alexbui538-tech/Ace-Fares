<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ace Fares Bookings</title>
<link rel="icon" href="images/logo.png">
<style>
:root{--ivory:#FBF8F1;--paper:#fff;--cream:#F3ECDD;--line:#E4DCCB;--ink:#15130F;--ink-2:#514A3D;--ink-3:#6F6757;--gold:#AF8135;--gold-bright:#DAA336;--navy:#0F1A34;--ok:#2F6B3A;--bad:#8A2D14}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--navy);color:#F4EFE4;padding:14px 20px;display:flex;align-items:center;gap:14px}
header img{height:40px;background:var(--ivory);border-radius:6px;padding:3px}
header h1{font:600 1.1rem system-ui;margin:0}
header a{margin-left:auto;color:var(--gold-bright);text-decoration:none;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.login{max-width:380px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px}
.login h2{margin:0;font-size:1.3rem}
input{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;width:100%}
input:focus{outline:none;border-color:var(--gold)}
button{min-height:44px;border-radius:10px;border:0;padding:0 16px;font:600 15px system-ui;cursor:pointer;background:var(--ink);color:var(--ivory)}
button.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
button.danger{background:transparent;color:var(--bad);border:1.5px solid #E7B9A9;min-height:36px;padding:0 12px}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);margin:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.bar label input{width:auto;min-height:0}
.bar .grow{flex:1}
h2.car{font-size:1.15rem;margin:26px 0 10px}
.wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1240px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-size:.8rem;color:var(--ink-3);font-weight:600;background:var(--ivory)}
td small{display:block;color:var(--ink-3)}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--cream);color:var(--ink-2)}
.pill.confirmed{background:#E3F0E2;color:var(--ok)}
.pill.hold{background:#FDF3DC;color:#7A5A12}
.pill.conflict{background:#FBE3D9;color:var(--bad)}
.dep{font-size:.86rem}
.dep .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dep button{min-height:32px;padding:0 10px;font-size:.82rem;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.dep .warn,td small.warn{color:var(--bad)}
.empty{color:var(--ink-3);padding:14px 12px;margin:0}
.tc{font-size:.86rem;min-width:200px}
.tc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tc button{min-height:32px;padding:0 10px;font-size:.82rem;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tc button.go{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.tc .ext{background:#FDF3DC;border-radius:8px;padding:8px;margin-bottom:6px}
.tc ul{margin:4px 0 0;padding-left:16px}
.switch{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.switch input{width:auto;min-height:0}
dialog{border:0;border-radius:14px;padding:0;width:min(460px,calc(100vw - 24px));box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(15,26,52,.45)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h3{margin:0}
dialog select,dialog textarea{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;width:100%}
dialog .hint{color:var(--ink-3);font-size:.88rem;margin:-6px 0 0}
dialog .lines{background:var(--ivory);border-radius:10px;padding:10px 12px;font-size:.92rem}
dialog .lines div{display:flex;justify-content:space-between;gap:10px}
dialog .lines div.tot{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
dialog label.radio{display:flex;gap:8px;align-items:center}
dialog label.radio input{width:auto;min-height:0}
.revs{display:grid;gap:10px}
.rev{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.rev.hidden{opacity:.55}
.rev p{margin:2px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:10px}
</style>
</head>
<body>
<header><img src="images/logo@2x.png" alt="Ace Fares"><h1>Bookings</h1><a href="/">View site</a></header>
<main id="app">
  <form class="login" id="login">
    <h2>Owner sign-in</h2>
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button type="submit">Show bookings</button>
  </form>
</main>
<script>
const CARS = { escalade: "Cadillac Escalade", srx: "Cadillac SRX", bmw: "BMW 650i Convertible", van: "Honda Odyssey" };
const PLACES = { "dallas-pickup": "Dallas pickup", "dallas-delivery": "Delivery", "dfw": "DFW Airport" };
const LABEL = { confirmed: "Paid", hold: "In checkout", conflict: "Paid, dates taken: refund", cancelled: "Cancelled", released: "Checkout abandoned", expired: "Checkout expired" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const nice = d => d ? new Date(d + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" }) : "";
const t12 = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const money = c => c ? "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2 }) : "";
let KEY = ""; try { KEY = sessionStorage.getItem("af-admin") || ""; } catch {}
let showAll = false, DATA = null;
const CAR_MILES = { escalade: 100, srx: 200, bmw: 100, van: 200 };
const days = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
async function adminTrip(body){
  const r = await fetch("/api/admin/trip", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(body) });
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 4000); }

async function load(){
  const r = await fetch("/api/admin/bookings", { headers: { "x-admin-key": KEY } });
  if (r.status === 401) { KEY = ""; try { sessionStorage.removeItem("af-admin"); } catch {} return renderLogin("That admin key isn't right."); }
  if (!r.ok) return renderLogin("Couldn't load bookings. Try again.");
  render(await r.json());
}
function renderLogin(err){
  try { if (err) sessionStorage.setItem("af-admin-err", err); } catch {}
  location.reload();
}
const dollars = c => "$" + (c / 100).toFixed(2);
function photoCell(car, b){
  if (b.status !== "confirmed") return "";
  const i = b.inspection || {}, line = (st, label) => {
    const x = i[st] || {}, who = [x.renter ? "renter" : "", x.host ? "you" : ""].filter(Boolean).join(" + ");
    const r = x.host || x.renter;
    return `<small>${label}: ${who ? `${who}${r ? ` · ${Number(r.odometer).toLocaleString()} mi, fuel ${esc(r.fuel)}` : ""}` : "not yet"}</small>`;
  };
  const miles = i.pickup && i.return ? ((i.return.host || i.return.renter).odometer - (i.pickup.host || i.pickup.renter).odometer) : null;
  return `<a class="pill" href="/inspect.html?car=${car}&ref=${encodeURIComponent(b.id)}&as=host&stage=${i.pickup && (i.pickup.host) ? "return" : "pickup"}">Photos</a>${line("pickup", "Pickup")}${line("return", "Return")}${miles != null ? `<small><b>${miles.toLocaleString()} miles driven</b></small>` : ""}`;
}
function idCell(b){
  if (b.status !== "confirmed") return "";
  const v = b.verification || {};
  const due = b.confirmedAt ? Date.parse(b.confirmedAt) + 3600e3 : 0;
  const st = !["verified", "review", "processing"].includes(v.status) && due && Date.now() > due ? "overdue" : (v.status || "not_started");
  const L = { verified: ["confirmed", "Verified"], review: ["hold", "Needs your review"], processing: ["hold", "Processing"], started: ["", "Started, not finished"], retry: ["conflict", "Failed, renter can retry"], canceled: ["conflict", "Cancelled"], not_started: ["", "Due within 1 hour of booking"], overdue: ["conflict", "Overdue (over 1 hour)"] }[st] || ["", st];
  let more = "";
  if (v.verifiedName) more += `<small>Name on license: ${esc(v.verifiedName)}</small>`;
  if (v.reasons && v.reasons.length) more += v.reasons.map(r => `<small class="warn">${esc(r)}</small>`).join("");
  if (v.error && st === "retry") more += `<small>${esc(v.error.message || "")}</small>`;
  if (v.sessionId) more += `<small><a href="https://dashboard.stripe.com/${/^vs_test_/.test(v.sessionId) ? "test/" : ""}identity/verification-sessions/${esc(v.sessionId)}" target="_blank" rel="noopener">Open in Stripe</a>${v.redactedAt ? " · photos deleted" : ""}</small>`;
  return `<span class="pill ${L[0]}">${L[1]}</span>${more}`;
}
function depositCell(car, b){
  const d = b.deposit; if (!d || !d.status || b.status !== "confirmed" && d.status !== "held") return "";
  const btn = (action, label) => `<button data-dep="${action}" data-car="${car}" data-id="${esc(b.id)}" data-max="${d.amount || 0}">${label}</button>`;
  let t = "", acts = "";
  if (d.status === "scheduled") t = `${dollars(d.amount)} goes on ${new Date(d.placeAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
  else if (d.status === "held") {
    t = `<b>${dollars(d.amount)} held</b><small>until ${new Date(d.captureBefore).toLocaleDateString()}${d.extended ? " (extended)" : ""}${d.keep ? " · kept: won't auto-release" : ""}</small>${d.renewError ? `<small class="warn">Renewal failed: ${esc(d.renewError)}</small>` : ""}`;
    acts = btn("capture", "Collect…") + btn("release", "Release") + (d.keep ? btn("unkeep", "Auto-release") : btn("keep", "Keep hold"));
  } else if (d.status === "failed") { t = `<span class="warn">Hold failed</span><small>${esc(d.error || "")}</small>`; acts = btn("place", "Try again"); }
  else if (d.status === "captured") t = `Collected ${dollars(d.capturedAmount || 0)}${d.captureNote ? `<small>${esc(d.captureNote)}</small>` : ""}`;
  else if (d.status === "released") t = `Released<small>${esc(d.releaseReason || "")}</small>`;
  return t + (acts ? `<div class="acts">${acts}</div>` : "");
}
async function depositAction(btn){
  const action = btn.dataset.dep, body = { car: btn.dataset.car, id: btn.dataset.id, action };
  if (action === "capture") {
    const max = (Number(btn.dataset.max) / 100).toFixed(2);
    const amt = prompt(`Amount to collect from the deposit (up to $${max}). The rest is released automatically:`, "150");
    if (amt == null) return;
    body.amount = Number(String(amt).replace(/[$,]/g, ""));
    body.note = prompt("Reason (the renter sees this on your itemized statement), e.g. Smoking remediation fee, photos sent 10/14:", "") || "";
  } else if (action === "release" && !confirm("Release the whole deposit hold now?")) return;
  btn.disabled = true;
  const r = await fetch("/api/admin/deposit", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.ok) { toast({ capture: "Collected. The rest of the hold is released.", release: "Hold released.", keep: "Hold kept: it won't auto-release.", unkeep: "Hold will auto-release after return.", place: data.deposit && data.deposit.status === "held" ? "Hold placed." : "Hold failed again." }[action]); load(); }
  else { btn.disabled = false; toast(data.message || "Couldn't do that. Try again."); }
}
function changesCell(car, b){
  let h = "";
  const x = b.extension;
  if (x && (x.status === "requested" || x.status === "payment_failed")) {
    h += `<div class="ext"><b>${x.status === "requested" ? "Wants to extend" : "Extension: card declined"}</b><small>to ${nice(x.to)} ${t12(x.toTime || b.toTime)} · ${x.quote.days} day${x.quote.days > 1 ? "s" : ""} · ${money(x.quote.total)}</small>${x.error ? `<small class="warn">${esc(x.error)}</small>` : ""}
      <div class="acts"><button class="go" data-ext="extend-approve" data-car="${car}" data-id="${esc(b.id)}" data-amt="${x.quote.total}">${x.status === "requested" ? "Approve" : "Try card again"}</button><button data-ext="extend-decline" data-car="${car}" data-id="${esc(b.id)}">Decline</button></div></div>`;
  }
  for (const e of b.extensions || []) h += `<small>Extended ${nice(e.from)} → ${nice(e.to)} · ${money(e.amount)}</small>`;
  if (b.cancellation) h += `<small>${b.cancellation.by === "renter" ? "Renter cancelled" : "Cancelled"}${b.cancellation.fee ? ` · fee ${money(b.cancellation.fee)}` : ""} · refund ${money((b.cancellation.refund || 0) + (b.cancellation.extensionRefund || 0)) || "$0"}${b.cancellation.status === "refund_failed" ? `</small><small class="warn">Refund failed: refund in Stripe` : ""}</small>`;
  const cs = b.charges || [];
  if (cs.length) h += `<ul>${cs.map(c => `<li>${esc(c.label)} ${money(c.total)}${c.status === "failed" ? ` <span class="warn">failed</span>` : c.source === "deposit" ? " (deposit)" : ""}</li>`).join("")}</ul>`;
  if (b.status === "confirmed" || b.status === "cancelled") h += `<div class="acts"><button data-charge="1" data-car="${car}" data-id="${esc(b.id)}">Add charge…</button></div>`;
  if (b.reviewStars) h += `<small>Reviewed: ${"★".repeat(b.reviewStars)}</small>`;
  return h;
}
function render(data){
  DATA = data;
  const today = new Date().toISOString().slice(0, 10);
  let html = `<div class="bar"><span class="grow">Upcoming paid bookings and anything in checkout. Refunds are done in your Stripe dashboard. Deposit holds release on their own 72 hours after return unless you keep or collect them.</span>
    <label><input type="checkbox" id="all" ${showAll ? "checked" : ""}> Show past and cancelled</label>
    <label class="switch" title="When off, renters can't request extensions in My trips"><input type="checkbox" id="ext-on" ${data._settings && data._settings.extensionsAllowed ? "checked" : ""}> Allow trip extension requests</label>
    <button class="line" id="refresh">Refresh</button><button class="danger" id="reset">Clear all bookings</button><button class="line" id="out">Sign out</button></div>`;
  for (const [car, name] of Object.entries(CARS)) {
    const list = (data[car] || []).filter(b => showAll || ((b.status === "confirmed" || b.status === "conflict" || (b.status === "hold" && Date.parse(b.expiresAt) > Date.now())) && b.to >= today))
      .sort((a, b) => a.from < b.from ? -1 : 1);
    html += `<h2 class="car">${name}</h2><div class="wrap">`;
    if (!list.length) { html += `<p class="empty">No bookings to show.</p></div>`; continue; }
    html += `<table><thead><tr><th>Dates</th><th>Renter</th><th>Where</th><th>Paid</th><th>Status</th><th>License check</th><th>Photos</th><th>Deposit hold</th><th>Extensions &amp; charges</th><th></th></tr></thead><tbody>`;
    for (const b of list) {
      const c = b.customer || {};
      const canCancel = b.status === "confirmed" || b.status === "hold" || b.status === "conflict";
      html += `<tr><td>${nice(b.from)} ${t12(b.fromTime)}<small>to ${nice(b.to)} ${t12(b.toTime)}</small></td>
        <td>${esc(c.name) || `<small>${b.status === "hold" ? "Not paid yet" : "No details recorded"}</small>`}${c.phone ? `<small><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></small>` : ""}${c.email ? `<small><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></small>` : ""}${b.insurance ? `<small>Insurance: ${b.insurance.choice === "roamly" ? "getting Roamly" : esc(b.insurance.company || "") + (b.insurance.policy ? " #" + esc(b.insurance.policy) : "")}</small>` : ""}${(b.credits || []).length ? `<small>Credits: ${b.credits.map(x => esc(x.label) + " " + money(x.amount)).join(", ")}</small>` : ""}</td>
        <td>${PLACES[b.location] || esc(b.location)}${b.handoff && b.handoff.address ? `<small>${esc(b.handoff.address)}</small>` : ""}${b.handoff && b.handoff.flight ? `<small>Flight ${esc(b.handoff.flight)}</small>` : ""}</td>
        <td>${money(b.amountPaid || (b.status === "confirmed" ? b.total : 0))}</td>
        <td><span class="pill ${esc(b.status)}">${LABEL[b.status] || esc(b.status)}</span>${b.signature ? `<small title="Fingerprint ${esc(b.signature.sha256)}">Signed ${esc(new Date(b.signature.signedAt).toLocaleString())}<br>IP ${esc(b.signature.ip)} · v${esc(b.signature.agreementVersion)}</small>` : ""}</td>
        <td>${idCell(b)}</td>
        <td>${photoCell(car, b)}</td>
        <td class="dep">${depositCell(car, b)}</td>
        <td class="tc">${changesCell(car, b)}</td>
        <td>${canCancel ? `<button class="danger" data-car="${car}" data-id="${esc(b.id)}">Cancel</button>` : ""}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  const revs = (data._reviews || []).slice().sort((a, b) => (a.at < b.at ? 1 : -1));
  html += `<h2 class="car">Reviews</h2>${revs.length ? `<div class="revs">${revs.map(r => `<div class="rev ${r.hidden ? "hidden" : ""}"><div><b>${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</b> ${esc(r.name)} · ${esc(r.carName)} · ${new Date(r.at).toLocaleDateString()}${r.text ? `<p>${esc(r.text)}</p>` : ""}${r.hidden ? "<small>Hidden from the website</small>" : ""}</div>
    <button class="line" style="min-height:34px;padding:0 12px" data-rev="${r.hidden ? "review-show" : "review-hide"}" data-id="${esc(r.id)}">${r.hidden ? "Show" : "Hide"}</button></div>`).join("")}</div>` : `<p class="empty">No reviews yet. Renters are emailed a review link a couple of hours after each trip.</p>`}`;
  const app = document.getElementById("app"); app.innerHTML = html;
  document.getElementById("ext-on").onchange = async e => {
    const r = await adminTrip({ action: "settings", extensionsAllowed: e.target.checked });
    if (r.ok) toast(r.data.settings.extensionsAllowed ? "Renters can request extensions in My trips. You approve each one." : "Extension requests are off. Renters are asked to text you.");
    else { e.target.checked = !e.target.checked; toast("Couldn't save that. Try again."); }
  };
  app.querySelectorAll("button[data-rev]").forEach(btn => btn.onclick = async () => {
    btn.disabled = true; const r = await adminTrip({ action: btn.dataset.rev, id: btn.dataset.id });
    if (r.ok) { toast(btn.dataset.rev === "review-hide" ? "Review hidden from the website." : "Review is showing on the website."); load(); } else { btn.disabled = false; toast("Couldn't do that. Try again."); }
  });
  app.querySelectorAll("button[data-ext]").forEach(btn => btn.onclick = async () => {
    const approve = btn.dataset.ext === "extend-approve";
    if (approve && !confirm(`Approve this extension and charge the renter's card ${money(+btn.dataset.amt)}?`)) return;
    if (!approve && !confirm("Decline this extension? The renter is emailed and the extra days open up again.")) return;
    btn.disabled = true; const r = await adminTrip({ action: btn.dataset.ext, car: btn.dataset.car, id: btn.dataset.id });
    if (r.ok) { toast(approve ? "Approved and charged. The renter has been emailed." : "Declined. The renter has been emailed."); load(); }
    else { toast(r.data.message || "Couldn't do that. Try again."); load(); }
  });
  app.querySelectorAll("button[data-charge]").forEach(btn => btn.onclick = () => openCharge(btn.dataset.car, btn.dataset.id));
  document.getElementById("all").onchange = e => { showAll = e.target.checked; render(data); };
  document.getElementById("refresh").onclick = load;
  document.getElementById("reset").onclick = async () => {
    const typed = prompt("This empties every car's calendar so all dates are open again, and releases any deposit holds still on cards.\nNothing is deleted: the bookings are saved in an archive.\nRefunds aren't made automatically.\n\nType RESET to confirm:");
    if (typed !== "RESET") return;
    const r = await fetch("/api/admin/reset", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify({ confirm: "RESET" }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { toast(`Calendars cleared: ${d.archived} booking${d.archived === 1 ? "" : "s"} archived${d.released ? `, ${d.released} deposit hold${d.released === 1 ? "" : "s"} released` : ""}.`); load(); }
    else toast(d.message || "That didn't work. Please try again.");
  };
  document.getElementById("out").onclick = () => { try { sessionStorage.removeItem("af-admin"); } catch {} location.reload(); };
  app.querySelectorAll("button[data-dep]").forEach(btn => btn.onclick = () => depositAction(btn));
  app.querySelectorAll("button.danger[data-id]").forEach(btn => btn.onclick = async () => {
    if (!confirm("Cancel this booking? The dates open up again. If they paid, refund them in Stripe.")) return;
    btn.disabled = true;
    const r = await fetch("/api/admin/cancel", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify({ car: btn.dataset.car, id: btn.dataset.id }) });
    if (r.ok) { toast("Booking cancelled. The dates are open again."); load(); } else { btn.disabled = false; toast("Couldn't cancel. Try again."); }
  });
}

/* post-trip charges */
const dlg = document.createElement("dialog"); dlg.id = "charge-dlg";
dlg.innerHTML = `<form method="dialog" id="cf"><h3>Add a charge</h3><p class="hint" id="cf-who"></p>
  <label for="cf-type">What for</label><select id="cf-type"></select><p class="hint" id="cf-hint"></p>
  <div id="cf-qty-w"><label for="cf-qty" id="cf-qty-l">Quantity</label><input id="cf-qty" inputmode="numeric"><p class="hint" id="cf-miles"></p></div>
  <div id="cf-cost-w"><label for="cf-cost" id="cf-cost-l">Amount ($)</label><input id="cf-cost" inputmode="decimal" placeholder="0.00"></div>
  <label for="cf-note">Note for the renter's statement</label><textarea id="cf-note" rows="2" placeholder="e.g. NTTA tolls Mar 2-4, statement attached by email"></textarea>
  <div id="cf-src"></div><div class="lines" id="cf-lines">Fill in the details to see the total.</div><p class="err" id="cf-err" role="alert"></p>
  <div class="row"><button type="button" class="line" id="cf-cancel">Cancel</button><button type="button" id="cf-go" disabled>Charge</button></div></form>`;
document.body.appendChild(dlg);
let CF = null, cfTimer = 0;
function openCharge(car, id){
  const b = (DATA[car] || []).find(x => x.id === id); if (!b) return;
  const types = DATA._chargeTypes || {};
  CF = { car, id, b };
  document.getElementById("cf-who").textContent = `${(b.customer && b.customer.name) || "Renter"} · ${CARS[car]} · ${nice(b.from)} to ${nice(b.to)}`;
  document.getElementById("cf-type").innerHTML = Object.entries(types).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join("");
  const held = b.deposit && b.deposit.status === "held";
  document.getElementById("cf-src").innerHTML = `<label class="radio"><input type="radio" name="src" value="card" checked> Charge the card they booked with</label>${held ? `<label class="radio"><input type="radio" name="src" value="deposit"> Collect from the ${money(b.deposit.amount)} deposit hold (the rest is released)</label>` : ""}`;
  ["cf-qty", "cf-cost", "cf-note"].forEach(i => document.getElementById(i).value = "");
  document.getElementById("cf-err").textContent = "";
  cfType(); dlg.showModal();
}
function cfType(){
  const t = (DATA._chargeTypes || {})[document.getElementById("cf-type").value] || {}, b = CF.b;
  document.getElementById("cf-hint").textContent = t.hint || "";
  document.getElementById("cf-qty-w").hidden = !t.qty; document.getElementById("cf-qty-l").textContent = t.qty || "";
  document.getElementById("cf-cost-w").hidden = !t.cost; document.getElementById("cf-cost-l").textContent = (t.cost || "") + " ($)";
  const mi = document.getElementById("cf-miles"); mi.textContent = "";
  if (document.getElementById("cf-type").value === "miles") {
    const i = b.inspection || {}, p = i.pickup && (i.pickup.host || i.pickup.renter), r = i.return && (i.return.host || i.return.renter);
    const included = (CAR_MILES[CF.car] || 0) * days(b.from, b.to);
    if (p && r) { const over = Math.max(0, r.odometer - p.odometer - included); mi.textContent = `Driven ${(r.odometer - p.odometer).toLocaleString()} mi, ${included.toLocaleString()} included: ${over.toLocaleString()} over.`; document.getElementById("cf-qty").value = over || ""; }
    else mi.textContent = `${included.toLocaleString()} miles included. Odometer photos aren't complete yet.`;
  } else if (t.qty && !document.getElementById("cf-qty").value) document.getElementById("cf-qty").value = "1";
  cfQuote();
}
async function cfQuote(){
  clearTimeout(cfTimer);
  cfTimer = setTimeout(async () => {
    const body = cfBody(), go = document.getElementById("cf-go"), lines = document.getElementById("cf-lines");
    go.disabled = true;
    const r = await adminTrip({ ...body, action: "charge-quote" });
    if (!r.ok) { lines.textContent = r.data.message || "Fill in the details to see the total."; return; }
    const q = r.data.quote;
    lines.innerHTML = q.lines.map(l => `<div><span>${esc(l.label)}</span><span>${money(l.amount)}</span></div>`).join("") + `<div class="tot"><span>Total</span><span>${money(q.total)}</span></div>`;
    go.disabled = false; go.textContent = `Charge ${money(q.total)}`;
  }, 250);
}
function cfBody(){
  const src = document.querySelector('#cf-src input[name="src"]:checked');
  return { car: CF.car, id: CF.id, type: document.getElementById("cf-type").value, qty: document.getElementById("cf-qty").value.replace(/[,\s]/g, ""),
    cost: document.getElementById("cf-cost").value, note: document.getElementById("cf-note").value.trim(), source: src ? src.value : "card" };
}
document.getElementById("cf-type").onchange = () => { document.getElementById("cf-qty").value = ""; cfType(); };
["cf-qty", "cf-cost", "cf-note"].forEach(i => document.getElementById(i).addEventListener("input", cfQuote));
document.getElementById("cf-src").addEventListener("change", cfQuote);
document.getElementById("cf-cancel").onclick = () => dlg.close();
document.getElementById("cf-go").onclick = async () => {
  const go = document.getElementById("cf-go"); go.disabled = true;
  const r = await adminTrip({ ...cfBody(), action: "charge" });
  if (r.ok) { dlg.close(); toast(`Charged ${money(r.data.charge.total)}. The renter was emailed an itemized statement.`); load(); }
  else { go.disabled = false; document.getElementById("cf-err").textContent = r.data.message || "That didn't go through. Try again."; if (r.status === 402) load(); }
};

document.getElementById("login").addEventListener("submit", e => {
  e.preventDefault(); KEY = document.getElementById("key").value.trim();
  try { sessionStorage.setItem("af-admin", KEY); } catch {}
  load();
});
try { const m = sessionStorage.getItem("af-admin-err"); if (m) { document.getElementById("login-err").textContent = m; sessionStorage.removeItem("af-admin-err"); } } catch {}
if (KEY) load();
</script>
</body>
</html>
